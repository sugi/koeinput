[package]
name = "koeinput-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "koeinput-daemon"
path = "src/main.rs"

[features]
test-hooks = ["koeinput-core/test-hooks"]

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
koeinput-core = { path = "../core" }
koeinput-dbus-api = { version = "0.1.0", path = "../dbus-api" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }

[dev-dependencies]
futures-util = "0.3.34"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
